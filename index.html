<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Management System</title>
<style>
:root{--ink:#17233b;--muted:#718096;--line:#e5eaf2;--blue:#315efb;--bg:#f5f7fb;--card:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px Inter,system-ui,Segoe UI,Arial,sans-serif}button,input,select,textarea{font:inherit}button{border:0;border-radius:10px;padding:11px 15px;background:var(--blue);color:#fff;cursor:pointer;font-weight:650}button.secondary{background:#edf1ff;color:#315efb}button.danger{background:#fff0f0;color:#c33}button:disabled{opacity:.5;cursor:not-allowed}.shell{display:flex;min-height:100vh}.side{width:245px;background:#101b34;color:#fff;padding:26px 18px;display:flex;flex-direction:column;gap:25px}.brand{font-size:19px;font-weight:800;letter-spacing:-.4px}.brand small{display:block;color:#9eacc9;font-size:11px;font-weight:500;margin-top:5px}.nav{display:grid;gap:8px}.nav button{background:transparent;color:#b9c5dd;text-align:left}.nav button.active,.nav button:hover{background:#23345b;color:#fff}.main{flex:1;min-width:0;padding:30px;max-width:1600px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:25px}.top h1{margin:0;font-size:27px;letter-spacing:-.8px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:22px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 5px 20px #20345b08}.metric{font-size:30px;font-weight:800;margin-top:8px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row .grow{flex:1}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:13px;font-weight:650;color:#46536b}.field input,.field select,.field textarea{width:100%;border:1px solid #dce3ef;border-radius:9px;padding:11px;background:#fff;color:var(--ink)}.search{max-width:360px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:#6d7890;font-size:11px;text-transform:uppercase;letter-spacing:.06em}td.actions{display:flex;gap:6px}.tablewrap{overflow:auto}.hidden{display:none!important}.login{max-width:420px;margin:9vh auto;padding:30px}.login h1{margin:0 0 6px}.notice{padding:12px 14px;border-radius:10px;background:#eef4ff;color:#3150a0;margin:12px 0}.error{background:#fff0f0;color:#a22}.tag{display:inline-block;border-radius:99px;background:#eaf0ff;color:#315efb;padding:4px 9px;font-size:11px;font-weight:700}.fieldrow{display:grid;grid-template-columns:1.2fr .8fr .6fr auto;gap:8px;align-items:center;margin:8px 0}.fieldrow input,.fieldrow select{min-width:0;padding:9px;border:1px solid var(--line);border-radius:8px}.public{max-width:760px;margin:5vh auto;padding:24px}.public .panel{padding:28px}@media(max-width:850px){.side{width:190px}.grid{grid-template-columns:repeat(2,1fr)}.main{padding:20px}}@media(max-width:600px){.shell{display:block}.side{width:auto;padding:15px;gap:12px}.nav{grid-template-columns:repeat(3,1fr)}.nav button{text-align:center;padding:9px 5px;font-size:12px}.main{padding:14px}.grid{gap:9px}.card{padding:14px}.metric{font-size:24px}.fieldrow{grid-template-columns:1fr 1fr}.top h1{font-size:22px}}
</style></head><body>
<div id="loginView" class="login card"><div class="brand" style="color:#17233b">SMS <small>STUDENT MANAGEMENT SYSTEM</small></div><h1 style="margin-top:30px">Admin sign in</h1><p class="muted">Sign in to manage student records and forms.</p><div class="field"><label>Admin password</label><input id="password" type="password" autocomplete="current-password" placeholder="Enter admin password"></div><button style="width:100%" onclick="login()">Sign in</button><div id="loginMsg"></div></div>
<div id="adminView" class="shell hidden"><aside class="side"><div class="brand">SMS <small>STUDENT MANAGEMENT</small></div><div class="nav"><button class="active" data-page="dashboard" onclick="page('dashboard',this)">◫ &nbsp; Dashboard</button><button data-page="students" onclick="page('students',this)">♙ &nbsp; Students</button><button data-page="forms" onclick="page('forms',this)">▤ &nbsp; Form Builder</button><button data-page="responses" onclick="page('responses',this)">☷ &nbsp; Responses</button></div><div style="margin-top:auto"><button class="secondary" style="width:100%" onclick="logout()">Log out</button></div></aside><main class="main"><div class="top"><div><div class="muted" style="font-size:12px">ADMINISTRATION / <span id="crumb">DASHBOARD</span></div><h1 id="pageTitle">Dashboard</h1></div><span class="tag">CONNECTED WORKSPACE</span></div><div id="content"></div></main></div>
<div id="publicView" class="public hidden"><div class="brand" style="color:#17233b">STUDENT INFORMATION PORTAL<small>SECURE FORM SUBMISSION</small></div><div class="panel" style="margin-top:22px"><h1 id="publicTitle">Loading form…</h1><p id="publicDesc" class="muted"></p><form id="publicForm" onsubmit="submitPublic(event)"></form><div id="publicMsg"></div></div></div>
<iframe name="apiFrame" id="apiFrame" class="hidden"></iframe>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbx6MOboyNMuEVpsa0vQiGBr3InLyE1cpEenxopBP_AYBMWscLmmxdKsxCCKGmQ8Dti1/exec';
let token=sessionStorage.getItem('sms_token')||'', currentPage='dashboard', studentHeaders=[], forms=[];
const $=id=>document.getElementById(id);
function jsonp(params){return new Promise((resolve,reject)=>{const cb='smscb_'+Math.random().toString(36).slice(2);const s=document.createElement('script');const t=setTimeout(()=>{cleanup();reject(new Error('API request timed out'));},20000);function cleanup(){clearTimeout(t);delete window[cb];s.remove()}window[cb]=d=>{cleanup();resolve(d)};s.onerror=()=>{cleanup();reject(new Error('Could not connect to Apps Script'))};s.src=API_URL+'?'+new URLSearchParams({...params,callback:cb}).toString();document.body.appendChild(s)})}
function post(payload){return new Promise((resolve,reject)=>{const nonce='n'+Math.random().toString(36).slice(2)+Date.now().toString(36);const frame=$('apiFrame');let done=false;const timer=setTimeout(()=>finish(new Error('Apps Script did not respond. Check deployment access and try again.')),30000);function finish(err,data){if(done)return;done=true;clearTimeout(timer);frame.removeEventListener('load',onload);if(err)reject(err);else resolve(data)}async function onload(){try{const result=await jsonp({action:'postResult',nonce});if(!result||result.pending)throw new Error('Waiting for Apps Script response');finish(null,result)}catch(err){if(!done){const retry=setTimeout(async()=>{try{const result=await jsonp({action:'postResult',nonce});if(result&&!result.pending)finish(null,result)}catch(e){}},1200);setTimeout(()=>clearTimeout(retry),1500)}}}frame.addEventListener('load',onload);const form=document.createElement('form');form.method='POST';form.action=API_URL;form.target='apiFrame';const input=document.createElement('input');input.name='payload';input.value=JSON.stringify(payload);const n=document.createElement('input');n.name='nonce';n.value=nonce;form.append(input,n);document.body.appendChild(form);form.submit();form.remove()})}
async function login(){const msg=$('loginMsg');msg.textContent='';try{const r=await post({action:'login',password:$('password').value});if(!r.ok)throw Error(r.error);token=r.token;sessionStorage.setItem('sms_token',token);$('loginView').classList.add('hidden');$('adminView').classList.remove('hidden');page('dashboard')}catch(e){msg.className='notice error';msg.textContent=e.message}}
async function logout(){try{await post({action:'logout',token})}catch(e){}token='';sessionStorage.removeItem('sms_token');$('adminView').classList.add('hidden');$('loginView').classList.remove('hidden')}
async function admin(task,extra={}){const r=await jsonp({action:'admin',task,token,...extra});if(!r.ok)throw Error(r.error||'Request failed');return r}
function page(name,btn){currentPage=name;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===name));$('crumb').textContent=name.toUpperCase();$('pageTitle').textContent=({dashboard:'Dashboard',students:'Student Database',forms:'Dynamic Form Builder',responses:'Form Responses'})[name];({dashboard:dashboard,students:students,forms:formBuilder,responses:responses}[name])().catch(showError)}
function showError(e){$('content').innerHTML='<div class="notice error">'+esc(e.message)+'</div>'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function dashboard(){const d=await admin('dashboard');$('content').innerHTML='<div class="grid"><div class="card"><div class="muted">Total students</div><div class="metric">'+d.total+'</div></div><div class="card"><div class="muted">Missing key details</div><div class="metric">'+d.missing+'</div></div><div class="card"><div class="muted">Active forms</div><div class="metric">'+d.forms+'</div></div><div class="card"><div class="muted">Detected columns</div><div class="metric">'+d.columns+'</div></div></div><div class="panel"><h3>Welcome to your student database</h3><p class="muted">Manage records, create shareable forms and review submissions. Your existing spreadsheet layout and spacer columns are retained.</p><button onclick="page(\'students\')">Manage students</button> <button class="secondary" onclick="page(\'forms\')">Create a form</button></div>'}
async function students(q=''){const d=await admin('listStudents',{q});studentHeaders=d.headers;$('content').innerHTML='<div class="panel"><div class="row"><input id="studentSearch" class="search grow" placeholder="Search name, enrollment, mobile or email" value="'+esc(q)+'" onkeydown="if(event.key===\'Enter\')students(this.value)"><button onclick="studentEditor()">+ Add student</button><button class="secondary" onclick="downloadCsv()">Export CSV</button></div><div class="tablewrap" style="margin-top:15px"><table><thead><tr>'+d.headers.slice(0,7).map(h=>'<th>'+esc(h)+'</th>').join('')+'<th>Actions</th></tr></thead><tbody>'+d.records.map(r=>'<tr>'+d.headers.slice(0,7).map(h=>'<td>'+esc(r[h])+'</td>').join('')+'<td class="actions"><button class="secondary" onclick=\'studentEditor('+JSON.stringify(r).replace(/'/g,"&#39;")+')\'>Edit</button><button class="danger" onclick="removeStudent('+r._row+')">Delete</button></td></tr>').join('')+'</tbody></table></div><p class="muted">'+d.records.length+' records shown · table displays first 7 fields; edit opens all fields.</p></div>'}
function studentEditor(record={}){const editing=!!record._row;$('content').innerHTML='<div class="panel"><div class="row"><h3 class="grow">'+(editing?'Edit student':'Add student')+'</h3><button class="secondary" onclick="students()">Back</button></div><form id="studentEdit" onsubmit="saveStudent(event)"><input type="hidden" name="_row" value="'+(record._row||'')+'">'+studentHeaders.map(h=>'<div class="field"><label>'+esc(h)+'</label><input name="'+esc(h)+'" value="'+esc(record[h]||'')+'"></div>').join('')+'<button>Save student</button></form></div>'}
async function saveStudent(e){e.preventDefault();const obj=Object.fromEntries(new FormData(e.target));obj._row=Number(obj._row||0);try{const r=await post({action:'saveStudent',token,record:obj});if(!r.ok)throw Error(r.error);page('students')}catch(e){showError(e)}}
async function removeStudent(row){if(!confirm('Delete this student record? This cannot be undone.'))return;try{const r=await post({action:'deleteStudent',token,row});if(!r.ok)throw Error(r.error);students()}catch(e){showError(e)}}
async function downloadCsv(){try{const r=await admin('export');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([r.csv],{type:'text/csv'}));a.download=r.filename;a.click();URL.revokeObjectURL(a.href)}catch(e){showError(e)}}
async function formBuilder(){const d=await admin('listForms');forms=d.forms;$('content').innerHTML='<div class="panel"><div class="row"><h3 class="grow">Your forms</h3><button onclick="editForm()">+ Create form</button></div>'+forms.map(f=>'<div class="row" style="padding:13px 0;border-top:1px solid var(--line)"><div class="grow"><b>'+esc(f.title)+'</b><div class="muted" style="font-size:12px">'+f.fields.length+' fields · '+(f.published?'Published':'Draft')+'</div></div>'+(f.published?'<button class="secondary" onclick="copyLink(\''+f.id+'\')">Copy link</button>':'')+'<button class="secondary" onclick="editForm(\''+f.id+'\')">Edit</button><button class="danger" onclick="removeForm(\''+f.id+'\')">Delete</button></div>').join('')+'</div>'}
function editForm(id){const f=forms.find(x=>x.id===id)||{title:'',description:'',fields:[],published:false};$('content').innerHTML='<div class="panel"><div class="row"><h3 class="grow">'+(id?'Edit form':'Create form')+'</h3><button class="secondary" onclick="formBuilder()">Back</button></div><div class="field"><label>Form title</label><input id="formTitle" value="'+esc(f.title)+'"></div><div class="field"><label>Description</label><textarea id="formDesc">'+esc(f.description)+'</textarea></div><h4>Fields</h4><div id="fieldList">'+f.fields.map(fieldHtml).join('')+'</div><button class="secondary" onclick="addField()">+ Add field</button><label style="display:block;margin:18px 0"><input type="checkbox" id="published" '+(f.published?'checked':'')+'> Publish form and enable public link</label><button onclick="saveForm(\''+(id||'')+'\')">Save form</button></div>'}
function fieldHtml(f={label:'',type:'text',required:true}){return '<div class="fieldrow"><input class="f-label" placeholder="Field label" value="'+esc(f.label)+'"><select class="f-type"><option value="text" '+(f.type==='text'?'selected':'')+'>Text</option><option value="email" '+(f.type==='email'?'selected':'')+'>Email</option><option value="tel" '+(f.type==='tel'?'selected':'')+'>Mobile</option><option value="number" '+(f.type==='number'?'selected':'')+'>Number</option><option value="date" '+(f.type==='date'?'selected':'')+'>Date</option></select><label><input class="f-required" type="checkbox" '+(f.required?'checked':'')+'> Required</label><button class="danger" onclick="this.parentElement.remove()">×</button></div>'}
function addField(){ $('fieldList').insertAdjacentHTML('beforeend',fieldHtml())}
async function saveForm(id){const fields=[...document.querySelectorAll('.fieldrow')].map((el,i)=>({label:el.querySelector('.f-label').value.trim(),key:'f'+i,type:el.querySelector('.f-type').value,required:el.querySelector('.f-required').checked})).filter(f=>f.label);try{const r=await post({action:'saveForm',token,form:{id,title:$('formTitle').value,description:$('formDesc').value,fields,published:$('published').checked}});if(!r.ok)throw Error(r.error);formBuilder()}catch(e){showError(e)}}
async function removeForm(id){if(!confirm('Delete this form?'))return;try{const r=await post({action:'deleteForm',token,formId:id});if(!r.ok)throw Error(r.error);formBuilder()}catch(e){showError(e)}}
function copyLink(id){const url=location.origin+location.pathname+'?form='+encodeURIComponent(id);navigator.clipboard.writeText(url).then(()=>alert('Form link copied:\n'+url)).catch(()=>prompt('Copy this form link',url))}
async function responses(){const d=await admin('responses');$('content').innerHTML='<div class="panel"><h3>Recent submissions</h3><div class="tablewrap"><table><thead><tr>'+d.headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+d.rows.map(r=>'<tr>'+r.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></div>'}
async function loadPublic(id){$('loginView').classList.add('hidden');$('publicView').classList.remove('hidden');try{const r=await jsonp({action:'publicForm',formId:id});if(!r.ok)throw Error(r.error);const f=r.form;$('publicTitle').textContent=f.title;$('publicDesc').textContent=f.description;$('publicForm').innerHTML=f.fields.map(x=>'<div class="field"><label>'+esc(x.label)+(x.required?' *':'')+'</label><input name="'+esc(x.key)+'" type="'+esc(x.type)+'" '+(x.required?'required':'')+'></div>').join('')+'<button type="submit">Submit information</button>'}catch(e){$('publicTitle').textContent='Form unavailable';$('publicMsg').textContent=e.message}}
async function submitPublic(e){e.preventDefault();const id=new URLSearchParams(location.search).get('form');const data=Object.fromEntries(new FormData(e.target));$('publicMsg').textContent='Submitting…';try{const r=await post({action:'submitForm',formId:id,data});if(!r.ok)throw Error(r.error);$('publicForm').reset();$('publicMsg').className='notice';$('publicMsg').textContent=r.message}catch(err){$('publicMsg').className='notice error';$('publicMsg').textContent=err.message}}
const formId=new URLSearchParams(location.search).get('form');if(formId)loadPublic(formId);else if(token){$('loginView').classList.add('hidden');$('adminView').classList.remove('hidden');page('dashboard')}
</script></body></html>
