<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Management System</title>
<style>
:root{--ink:#17233b;--muted:#74819a;--line:#e6eaf2;--blue:#5267f5;--blue2:#394edb;--bg:#f5f7fc;--card:#fff;--nav:#111a31;--nav2:#1d2a4a;--green:#16865b;--amber:#a66a12;--red:#c43e4b}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{border:0;border-radius:10px;padding:11px 16px;background:var(--blue);color:#fff;cursor:pointer;font-weight:700;transition:.18s ease}button:hover{background:var(--blue2);transform:translateY(-1px);box-shadow:0 7px 18px #5267f52b}button.secondary{background:#eef1ff;color:#4055df}button.secondary:hover{background:#e1e6ff}button.danger{background:#fff0f1;color:var(--red)}button:disabled{opacity:.48;cursor:not-allowed;transform:none;box-shadow:none}
.shell{display:flex;min-height:100vh}.side{width:258px;flex:0 0 258px;background:linear-gradient(165deg,var(--nav),var(--nav2));color:#fff;padding:27px 18px 20px;display:flex;flex-direction:column;gap:28px;box-shadow:8px 0 28px #15234712}.brand{font-size:21px;font-weight:850;letter-spacing:-.8px;padding:0 10px}.brand small{display:block;color:#aab6d1;font-size:10px;font-weight:700;letter-spacing:1.5px;margin-top:6px}.nav-label{font-size:10px;font-weight:800;letter-spacing:1.5px;color:#8493b4;padding:0 12px;margin-bottom:3px}.nav{display:grid;gap:6px}.nav button{background:transparent;color:#b7c2d9;text-align:left;padding:12px 13px;border-radius:11px;font-weight:600}.nav button.active,.nav button:hover{background:#ffffff17;color:#fff;box-shadow:inset 3px 0 #8b9bff;transform:none}.side-foot{margin-top:auto;border-top:1px solid #ffffff1c;padding-top:17px}.main{flex:1;min-width:0;padding:30px clamp(18px,3vw,46px);max-width:1700px;margin:0 auto}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:27px;padding-bottom:19px;border-bottom:1px solid var(--line)}.top h1{margin:5px 0 0;font-size:29px;letter-spacing:-1.1px}.crumb{font-size:10px;color:#8a96ad;font-weight:800;letter-spacing:1.4px}.top-right{display:flex;align-items:center;gap:10px}.tag{display:inline-flex;align-items:center;gap:6px;border-radius:99px;background:#edf8f3;color:#187a55;padding:7px 11px;font-size:10px;font-weight:800;letter-spacing:.4px}.tag:before{content:"";width:6px;height:6px;border-radius:50%;background:#24a574}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:22px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:17px;box-shadow:0 8px 28px #20345b08}.card{padding:21px}.panel{padding:23px;margin-bottom:18px}.metric{font-size:32px;font-weight:850;letter-spacing:-1.5px;margin-top:9px}.muted{color:var(--muted)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row .grow{flex:1;min-width:160px}.section-kicker{font-size:10px;font-weight:850;letter-spacing:1.5px;color:#8591a8;text-transform:uppercase}.field{display:grid;gap:7px;margin:13px 0}.field label{font-size:12px;font-weight:750;color:#43516b}.field input,.field select,.field textarea,.search{width:100%;border:1px solid #dce2ee;border-radius:10px;padding:12px 13px;background:#fff;color:var(--ink);outline:none;transition:.15s}.field input:focus,.field select:focus,.field textarea:focus,.search:focus{border-color:#8493ff;box-shadow:0 0 0 3px #5267f51a}.search{max-width:390px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;margin-top:17px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{text-align:left;padding:13px 12px;border-bottom:1px solid var(--line);white-space:nowrap}th{background:#f8f9fd;color:#79859b;font-size:10px;text-transform:uppercase;letter-spacing:1px}tbody tr:hover{background:#fafbff}tbody tr:last-child td{border-bottom:0}td.actions{display:flex;gap:6px}.notice{padding:13px 15px;border-radius:11px;background:#eff3ff;color:#4054a0;margin:12px 0}.error{background:#fff0f1;color:#a52e3c}.hidden{display:none!important}.login{max-width:430px;margin:9vh auto;padding:34px}.login h1{margin:25px 0 5px;font-size:28px;letter-spacing:-1px}.login .field{margin:22px 0}.builder-step{border:1px solid var(--line);border-radius:15px;padding:19px;margin:14px 0;background:#fff}.fieldrow{display:grid;grid-template-columns:1.1fr .65fr .85fr .9fr .5fr auto;gap:9px;align-items:center;margin:10px 0;padding:13px;background:#f8f9fd;border:1px solid var(--line);border-radius:12px}.fieldrow input,.fieldrow select{width:100%;min-width:0;padding:10px;border:1px solid #dce2ee;border-radius:9px;background:#fff}.fieldrow label{font-size:11px;color:#53617a}.field-help{font-size:12px;color:var(--muted);margin-top:5px}.public{max-width:760px;margin:5vh auto;padding:24px}.public .panel{padding:30px}.modal-backdrop{position:fixed;inset:0;z-index:50;background:#101a32a8;display:flex;align-items:center;justify-content:center;padding:20px}.modal{width:min(760px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:25px;box-shadow:0 25px 80px #0b163c55}.preview-field{padding:10px 0;border-bottom:1px solid #eef0f5}.preview-field:last-child{border-bottom:0}.preview-field input{width:100%;padding:12px;border:1px solid #dce2ee;border-radius:10px}.pill-manual,.pill-auto{font-size:9px;font-weight:800;letter-spacing:.5px;padding:4px 7px;border-radius:99px}.pill-manual{background:#fff4e4;color:#95600d}.pill-auto{background:#eaf7f0;color:#18784e}
@media(max-width:1000px){.side{width:220px;flex-basis:220px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.fieldrow{grid-template-columns:1fr 1fr}}@media(max-width:650px){.shell{display:block}.side{width:auto;padding:15px;gap:13px}.brand{padding:0 5px}.nav-label{display:none}.nav{grid-template-columns:repeat(4,1fr);gap:4px}.nav button{text-align:center;padding:10px 4px;font-size:11px}.side-foot{display:none}.main{padding:17px 13px}.top h1{font-size:23px}.top{align-items:flex-start}.top-right .tag{display:none}.grid{gap:9px}.card{padding:14px}.metric{font-size:25px}.panel{padding:16px}.fieldrow{grid-template-columns:1fr 1fr}.modal{padding:18px}.login{margin:5vh 14px}}
</style></head><body>
<div id="loginView" class="login card"><div class="brand" style="color:#17233b">SMS <small>STUDENT MANAGEMENT SYSTEM</small></div><h1 style="margin-top:30px">Admin sign in</h1><p class="muted">Sign in to manage student records and forms.</p><div class="field"><label>Admin password</label><input id="password" type="password" autocomplete="current-password" placeholder="Enter admin password"></div><button style="width:100%" onclick="login()">Sign in</button><div id="loginMsg"></div></div>
<div id="adminView" class="shell hidden"><aside class="side"><div class="brand">SMS <small>STUDENT MANAGEMENT</small></div><div><div class="nav-label">WORKSPACE</div><div class="nav"><button class="active" data-page="dashboard" onclick="page('dashboard',this)">◫ &nbsp; Dashboard</button><button data-page="students" onclick="page('students',this)">♙ &nbsp; Students</button><button data-page="forms" onclick="page('forms',this)">▤ &nbsp; Form Builder</button><button data-page="responses" onclick="page('responses',this)">☷ &nbsp; Responses</button></div></div><div class="side-foot"><button class="secondary" style="width:100%" onclick="logout()">Log out</button></div></aside><main class="main"><div class="top"><div><div class="crumb">ADMINISTRATION / <span id="crumb">DASHBOARD</span></div><h1 id="pageTitle">Dashboard</h1></div><div class="top-right"><span class="tag">CONNECTED WORKSPACE</span></div></div><div id="content"></div></main></div>
<div id="publicView" class="public hidden"><div class="brand" style="color:#17233b">STUDENT INFORMATION PORTAL<small>SECURE FORM SUBMISSION</small></div><div class="panel" style="margin-top:22px"><h1 id="publicTitle">Loading form…</h1><p id="publicDesc" class="muted"></p><form id="publicForm" onsubmit="submitPublic(event)"></form><div id="publicMsg"></div></div></div>
<div id="previewModal" class="modal-backdrop hidden" onclick="if(event.target===this)closePreview()"><div class="modal" id="previewContent"></div></div><iframe name="apiFrame" id="apiFrame" class="hidden"></iframe>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbx6MOboyNMuEVpsa0vQiGBr3InLyE1cpEenxopBP_AYBMWscLmmxdKsxCCKGmQ8Dti1/exec';
let token=sessionStorage.getItem('sms_token')||'', currentPage='dashboard', studentHeaders=[], forms=[], formMeta={columns:[],identityColumn:''}, activePublicFormId='';
const $=id=>document.getElementById(id);
function jsonp(params){return new Promise((resolve,reject)=>{const cb='smscb_'+Math.random().toString(36).slice(2);const s=document.createElement('script');const t=setTimeout(()=>{cleanup();reject(new Error('API request timed out'));},20000);function cleanup(){clearTimeout(t);delete window[cb];s.remove()}window[cb]=d=>{cleanup();resolve(d)};s.onerror=()=>{cleanup();reject(new Error('Could not connect to Apps Script'))};s.src=API_URL+'?'+new URLSearchParams({...params,callback:cb}).toString();document.body.appendChild(s)})}
function post(payload){return new Promise((resolve,reject)=>{const nonce='n'+Math.random().toString(36).slice(2)+Date.now().toString(36);const frame=$('apiFrame');let done=false;const timer=setTimeout(()=>finish(new Error('Apps Script did not respond. Check deployment access and try again.')),30000);function finish(err,data){if(done)return;done=true;clearTimeout(timer);frame.removeEventListener('load',onload);if(err)reject(err);else resolve(data)}async function onload(){try{const result=await jsonp({action:'postResult',nonce});if(!result||result.pending)throw new Error('Waiting for Apps Script response');finish(null,result)}catch(err){if(!done){const retry=setTimeout(async()=>{try{const result=await jsonp({action:'postResult',nonce});if(result&&!result.pending)finish(null,result)}catch(e){}},1200);setTimeout(()=>clearTimeout(retry),1500)}}}frame.addEventListener('load',onload);const form=document.createElement('form');form.method='POST';form.action=API_URL;form.target='apiFrame';const input=document.createElement('input');input.name='payload';input.value=JSON.stringify(payload);const n=document.createElement('input');n.name='nonce';n.value=nonce;form.append(input,n);document.body.appendChild(form);form.submit();form.remove()})}
async function login(){const msg=$('loginMsg');msg.textContent='';try{const r=await post({action:'login',password:$('password').value});if(!r.ok)throw Error(r.error);token=r.token;sessionStorage.setItem('sms_token',token);$('loginView').classList.add('hidden');$('adminView').classList.remove('hidden');page('dashboard')}catch(e){msg.className='notice error';msg.textContent=e.message}}
async function logout(){try{await post({action:'logout',token})}catch(e){}token='';sessionStorage.removeItem('sms_token');$('adminView').classList.add('hidden');$('loginView').classList.remove('hidden')}
async function admin(task,extra={}){const r=await jsonp({action:'admin',task,token,...extra});if(!r.ok)throw Error(r.error||'Request failed');return r}
function page(name,btn){currentPage=name;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===name));$('crumb').textContent=name.toUpperCase();$('pageTitle').textContent=({dashboard:'Dashboard',students:'Student Database',forms:'Dynamic Form Builder',responses:'Form Responses'})[name];({dashboard:dashboard,students:students,forms:formBuilder,responses:responses}[name])().catch(showError)}
function showError(e){$('content').innerHTML='<div class="notice error">'+esc(e.message)+'</div>'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function dashboard(){const d=await admin('dashboard');$('content').innerHTML='<div class="grid"><div class="card"><div class="muted">Total students</div><div class="metric">'+d.total+'</div></div><div class="card"><div class="muted">Missing key details</div><div class="metric">'+d.missing+'</div></div><div class="card"><div class="muted">Active forms</div><div class="metric">'+d.forms+'</div></div><div class="card"><div class="muted">Detected columns</div><div class="metric">'+d.columns+'</div></div></div><div class="panel"><h3>Welcome to your student database</h3><p class="muted">Manage records, create shareable forms and review submissions. Your existing spreadsheet layout and spacer columns are retained.</p><button onclick="page(\'students\')">Manage students</button> <button class="secondary" onclick="page(\'forms\')">Create a form</button></div>'}
async function students(q=''){const d=await admin('listStudents',{q});studentHeaders=d.headers;$('content').innerHTML='<div class="panel"><div class="row"><input id="studentSearch" class="search grow" placeholder="Search name, enrollment, mobile or email" value="'+esc(q)+'" onkeydown="if(event.key===\'Enter\')students(this.value)"><button onclick="studentEditor()">+ Add student</button><button class="secondary" onclick="downloadCsv()">Export CSV</button></div><div class="tablewrap" style="margin-top:15px"><table><thead><tr>'+d.headers.slice(0,7).map(h=>'<th>'+esc(h)+'</th>').join('')+'<th>Actions</th></tr></thead><tbody>'+d.records.map(r=>'<tr>'+d.headers.slice(0,7).map(h=>'<td>'+esc(r[h])+'</td>').join('')+'<td class="actions"><button class="secondary" onclick=\'studentEditor('+JSON.stringify(r).replace(/'/g,"&#39;")+')\'>Edit</button><button class="danger" onclick="removeStudent('+r._row+')">Delete</button></td></tr>').join('')+'</tbody></table></div><p class="muted">'+d.records.length+' records shown · table displays first 7 fields; edit opens all fields.</p></div>'}
function studentEditor(record={}){const editing=!!record._row;$('content').innerHTML='<div class="panel"><div class="row"><h3 class="grow">'+(editing?'Edit student':'Add student')+'</h3><button class="secondary" onclick="students()">Back</button></div><form id="studentEdit" onsubmit="saveStudent(event)"><input type="hidden" name="_row" value="'+(record._row||'')+'">'+studentHeaders.map(h=>'<div class="field"><label>'+esc(h)+'</label><input name="'+esc(h)+'" value="'+esc(record[h]||'')+'"></div>').join('')+'<button>Save student</button></form></div>'}
async function saveStudent(e){e.preventDefault();const obj=Object.fromEntries(new FormData(e.target));obj._row=Number(obj._row||0);try{const r=await post({action:'saveStudent',token,record:obj});if(!r.ok)throw Error(r.error);page('students')}catch(e){showError(e)}}
async function removeStudent(row){if(!confirm('Delete this student record? This cannot be undone.'))return;try{const r=await post({action:'deleteStudent',token,row});if(!r.ok)throw Error(r.error);students()}catch(e){showError(e)}}
async function downloadCsv(){try{const r=await admin('export');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([r.csv],{type:'text/csv'}));a.download=r.filename;a.click();URL.revokeObjectURL(a.href)}catch(e){showError(e)}}
async function formBuilder(){const [d,m]=await Promise.all([admin('listForms'),admin('formMeta')]);forms=d.forms;formMeta=m;$('content').innerHTML='<div class="panel"><div class="row"><div class="grow"><div class="section-kicker">Form workspace</div><h2 style="margin:5px 0">Your forms</h2><p class="muted">Create verified forms with student details pulled directly from your sheet.</p></div><button onclick="editForm()">＋ Create form</button></div>'+forms.map(f=>'<div class="builder-step row"><div class="grow"><b>'+esc(f.title)+'</b><div class="muted" style="font-size:12px;margin-top:5px">'+f.fields.length+' fields · '+(f.published?'Published':'Draft')+' · '+(f.fields.some(x=>x.lookupKey)?'Enrollment verification enabled':'Manual entry')+'</div></div>'+(f.published?'<button class="secondary" onclick="copyLink(\''+f.id+'\')">Copy link</button>':'')+'<button class="secondary" onclick="editForm(\''+f.id+'\')">Edit</button><button class="danger" onclick="removeForm(\''+f.id+'\')">Delete</button></div>').join('')+'</div>'}
function editForm(id){const f=forms.find(x=>x.id===id)||{title:'',description:'',fields:[],published:false};const cols=formMeta.columns||[];$('content').innerHTML='<div class="panel"><div class="row"><div class="grow"><div class="section-kicker">Form configuration</div><h2 style="margin:5px 0">'+(id?'Edit form':'Create a verified form')+'</h2><p class="muted">Choose what students enter and what the system fetches from the spreadsheet.</p></div><button class="secondary" onclick="formBuilder()">Back</button></div><div class="builder-step"><div class="field"><label>Form title</label><input id="formTitle" value="'+esc(f.title)+'" placeholder="e.g. Student Information Confirmation"></div><div class="field"><label>Instructions shown to students</label><textarea id="formDesc" rows="3" placeholder="Explain why this form is being collected">'+esc(f.description)+'</textarea></div></div><div class="builder-step"><div class="section-kicker">Step 1 · Identity verification</div><h3>Student confirmation key</h3><p class="muted">Enrollment Number will be checked against the student database before the form can be submitted.</p><span class="tag">Verification column: '+esc(formMeta.identityColumn||'Enrollment Number')+'</span></div><div class="builder-step"><div class="section-kicker">Step 2 · Form fields</div><p class="muted">For Auto-fill, select the existing source column. For Manual entry, select the existing destination column where the answer should be saved. No new sheet columns are created.</p><div id="fieldList">'+f.fields.map(fieldHtml).join('')+'</div><button class="secondary" onclick="addField()">＋ Add field</button></div><div class="builder-step"><div class="section-kicker">Step 3 · Publish</div><label style="display:block;margin:10px 0"><input type="checkbox" id="published" '+(f.published?'checked':'')+'> Publish form and enable public link</label><p class="field-help">Students must enter a valid Enrollment Number. Auto-filled details are fetched from the sheet; manually configured fields remain editable.</p><div class="row"><button class="secondary" type="button" onclick="previewForm()">Preview student experience</button><button onclick="saveForm(\''+(id||'')+'\')">Save form configuration</button></div></div></div>'}
function fieldHtml(f={label:'',type:'text',required:true,source:'manual',sourceColumn:'',targetColumn:'',lookupKey:false}){const cols=formMeta.columns||[];return '<div class="fieldrow"><input class="f-label" placeholder="Student-facing field label" value="'+esc(f.label)+'"><select class="f-type"><option value="text" '+(f.type==='text'?'selected':'')+'>Text</option><option value="email" '+(f.type==='email'?'selected':'')+'>Email</option><option value="tel" '+(f.type==='tel'?'selected':'')+'>Mobile</option><option value="number" '+(f.type==='number'?'selected':'')+'>Number</option><option value="date" '+(f.type==='date'?'selected':'')+'>Date</option></select><select class="f-source" onchange="toggleFieldMapping(this)"><option value="manual" '+((f.source||'manual')==='manual'?'selected':'')+'>Manual entry</option><option value="sheet" '+(f.source==='sheet'?'selected':'')+'>Auto-fill from sheet</option></select><select class="f-column-wrap f-column" style="'+(f.source==='sheet'?'':'display:none')+'"><option value="">Select source column</option>'+cols.map(c=>'<option value="'+esc(c)+'" '+(f.sourceColumn===c?'selected':'')+'>'+esc(c)+'</option>').join('')+'</select><select class="f-target-wrap f-target" style="'+((f.source||'manual')==='manual'?'':'display:none')+'"><option value="">Save manual answer in…</option>'+cols.map(c=>'<option value="'+esc(c)+'" '+(f.targetColumn===c?'selected':'')+'>'+esc(c)+'</option>').join('')+'</select><label style="font-size:12px"><input class="f-required" type="checkbox" '+(f.required?'checked':'')+'> Required</label><button class="danger" type="button" onclick="this.parentElement.remove()">×</button><label style="grid-column:1/-1;font-size:12px"><input class="f-lookup" type="checkbox" '+(f.lookupKey?'checked':'')+'> Use this field as the Enrollment Number verification input</label></div>'}
function toggleFieldMapping(select){const row=select.parentElement;const sheet=select.value==='sheet';row.querySelector('.f-column-wrap').style.display=sheet?'block':'none';row.querySelector('.f-target-wrap').style.display=sheet?'none':'block'}
function collectBuilderFields(){return [...document.querySelectorAll('.fieldrow')].map((el,i)=>({label:el.querySelector('.f-label').value.trim(),key:'f'+i,type:el.querySelector('.f-type').value,source:el.querySelector('.f-source').value,sourceColumn:el.querySelector('.f-column').value,targetColumn:el.querySelector('.f-target').value,lookupKey:el.querySelector('.f-lookup').checked,required:el.querySelector('.f-required').checked})).filter(f=>f.label)}
function closePreview(){$('previewModal').classList.add('hidden')}
function previewForm(){const fields=collectBuilderFields();if(!fields.length){showError(new Error('Add at least one field before previewing.'));return}if(fields.filter(f=>f.lookupKey).length!==1){showError(new Error('Select exactly one Enrollment Number verification field before previewing.'));return}const title=$('formTitle').value.trim()||'Student Information Form';const desc=$('formDesc').value.trim();$('previewContent').innerHTML='<div class="row"><div class="grow"><div class="section-kicker">Live student preview</div><h2 style="margin:5px 0">'+esc(title)+'</h2><p class="muted">'+esc(desc)+'</p></div><button class="secondary" onclick="closePreview()">Close preview</button></div><div class="notice">Preview mode · No response will be submitted or saved. Enter a real Enrollment Number to test sheet verification and autofill.</div><form id="previewStudentForm" onsubmit="event.preventDefault();alert(\'Preview only — no data has been submitted.\')">'+fields.map(f=>'<div class="preview-field"><div class="row"><label style="font-weight:750">'+esc(f.label)+(f.required?' *':'')+'</label><span class="'+(f.source==='sheet'?'pill-auto':'pill-manual')+'">'+(f.source==='sheet'?'AUTO-FILL':'MANUAL')+'</span></div><input data-preview-key="'+esc(f.key)+'" type="'+esc(f.type)+'" '+(f.required?'required':'')+' '+(f.source==='sheet'?'readonly placeholder="Will fill after verification"':'')+(f.lookupKey?' placeholder="Enter your Enrollment Number"':'')+'></div>').join('')+'<div id="previewStatus" class="field-help" style="margin:14px 0"></div><button type="submit">Test form (preview only)</button></form>';$('previewModal').classList.remove('hidden');const key=fields.find(f=>f.lookupKey);const input=$('previewStudentForm').querySelector('[data-preview-key="'+key.key+'"]');input.addEventListener('change',()=>runPreviewLookup(fields,key));input.addEventListener('blur',()=>runPreviewLookup(fields,key))}
async function runPreviewLookup(fields,key){const input=$('previewStudentForm').querySelector('[data-preview-key="'+key.key+'"]');const enrollment=input.value.trim();const status=$('previewStatus');if(!enrollment){status.textContent='Enter an Enrollment Number to verify.';return}status.textContent='Checking student database…';try{const columns=fields.filter(f=>f.source==='sheet').map(f=>f.sourceColumn);const r=await admin('previewLookup',{enrollment,columns});if(!r.ok)throw Error(r.error);fields.filter(f=>f.source==='sheet').forEach(f=>{const el=$('previewStudentForm').querySelector('[data-preview-key="'+f.key+'"]');if(el)el.value=r.student[f.sourceColumn]||''});status.className='notice';status.textContent='✓ Enrollment verified. Auto-filled fields have been populated from the live spreadsheet.'}catch(e){fields.filter(f=>f.source==='sheet').forEach(f=>{const el=$('previewStudentForm').querySelector('[data-preview-key="'+f.key+'"]');if(el)el.value=''});status.className='notice error';status.textContent=e.message}}
async function saveForm(id){const fields=collectBuilderFields();let keys=fields.filter(f=>f.lookupKey);if(keys.length===0){const detected=fields.filter(f=>['enrollmentnumber','enrollmentno'].includes(f.label.toLowerCase().replace(/[^a-z0-9]/g,'')));if(detected.length===1){detected[0].lookupKey=true;keys=detected}}if(keys.length!==1){showError(new Error(keys.length>1?'Only one field can be used for Enrollment Number verification.':'Add a field named “Enrollment Number” (or “Enrollment No”) and mark it as the verification field.'));return}if(fields.some(f=>f.source==='sheet'&&!f.sourceColumn)){showError(new Error('Choose an existing source column for every auto-fill field.'));return}if(fields.some(f=>f.source!=='sheet'&&!f.targetColumn)){showError(new Error('Choose an existing destination column for every manual-entry field. No new columns will be created.'));return}try{const r=await post({action:'saveForm',token,form:{id,title:$('formTitle').value,description:$('formDesc').value,fields,published:$('published').checked}});if(!r.ok)throw Error(r.error);formBuilder()}catch(e){showError(e)}}
async function removeForm(id){if(!confirm('Delete this form?'))return;try{const r=await post({action:'deleteForm',token,formId:id});if(!r.ok)throw Error(r.error);formBuilder()}catch(e){showError(e)}}
function copyLink(id){const url=location.origin+location.pathname+'?form='+encodeURIComponent(id);navigator.clipboard.writeText(url).then(()=>alert('Form link copied:\n'+url)).catch(()=>prompt('Copy this form link',url))}
async function responses(){const d=await admin('responses');$('content').innerHTML='<div class="panel"><h3>Recent submissions</h3><div class="tablewrap"><table><thead><tr>'+d.headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+d.rows.map(r=>'<tr>'+r.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></div>'}
async function loadPublic(id){activePublicFormId=String(id||new URLSearchParams(location.search).get('form')||new URLSearchParams(location.search).get('formId')||'');$('loginView').classList.add('hidden');$('publicView').classList.remove('hidden');try{const r=await jsonp({action:'publicForm',formId:activePublicFormId});if(!r.ok)throw Error(r.error);const f=r.form;activePublicFormId=String(f.id||activePublicFormId);const key=f.fields.find(x=>x.lookupKey);$('publicTitle').textContent=f.title;$('publicDesc').textContent=f.description+ (key?' Enter your Enrollment Number first; your registered details will be verified and filled automatically.':'');$('publicForm').innerHTML=(key?'<div class="notice">Step 1: Enter your Enrollment Number and verify your student record.</div>':'')+f.fields.map(x=>'<div class="field" '+(x.source==='sheet'?'data-autofill="true"':'')+'><label>'+esc(x.label)+(x.required?' *':'')+(x.source==='sheet'?' · AUTO-FILLED':'')+'</label><input name="'+esc(x.key)+'" type="'+esc(x.type)+'" '+(x.required?'required':'')+' '+(x.source==='sheet'?'readonly placeholder="Filled after enrollment verification"':'')+(x.lookupKey?' autocomplete="off" placeholder="Enter your Enrollment Number"':'')+'></div>').join('')+'<div id="verifyStatus" class="field-help"></div><button id="publicSubmit" type="submit" '+(key?'disabled':'')+'>Submit information</button>';if(key){const input=$('publicForm').querySelector('[name="'+key.key+'"]');input.addEventListener('change',()=>verifyPublicStudent(f,key));input.addEventListener('blur',()=>verifyPublicStudent(f,key));}}catch(e){$('publicTitle').textContent='Form unavailable';$('publicMsg').textContent=e.message}}
async function verifyPublicStudent(form,key){const input=$('publicForm').querySelector('[name="'+key.key+'"]');const enrollment=input.value.trim();const status=$('verifyStatus');const btn=$('publicSubmit');if(!enrollment){btn.disabled=true;return}status.textContent='Verifying enrollment number…';btn.disabled=true;try{const r=await jsonp({action:'lookupStudent',enrollment,formId:form.id});if(!r.ok)throw Error(r.error);const student=r.student;form.fields.filter(x=>x.source==='sheet').forEach(field=>{const el=$('publicForm').querySelector('[name="'+field.key+'"]');if(el)el.value=student[field.sourceColumn]||''});status.textContent='✓ Student verified. Registered details have been auto-filled. Complete the remaining fields.';status.className='notice';btn.disabled=false}catch(e){form.fields.filter(x=>x.source==='sheet').forEach(field=>{const el=$('publicForm').querySelector('[name="'+field.key+'"]');if(el)el.value=''});status.textContent=e.message;status.className='notice error';btn.disabled=true}}
async function submitPublic(e){e.preventDefault();const id=activePublicFormId||e.target.dataset.formId||new URLSearchParams(location.search).get('form')||new URLSearchParams(location.search).get('formId')||'';const data=Object.fromEntries(new FormData(e.target));data.__formId=id;$('publicMsg').textContent='Submitting…';try{if(!id)throw Error('This form link is missing its form ID. Please reopen the original published form link.');const r=await post({action:'submitForm',formId:id,data});if(!r.ok)throw Error(r.error);$('publicForm').reset();$('publicMsg').className='notice';$('publicMsg').textContent=r.message}catch(err){$('publicMsg').className='notice error';$('publicMsg').textContent=err.message}}
const formParams=new URLSearchParams(location.search);const formId=formParams.get('form')||formParams.get('formId');if(formId)loadPublic(formId);else if(token){$('loginView').classList.add('hidden');$('adminView').classList.remove('hidden');page('dashboard')}
</script></body></html>
